<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Karyawan</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--ink:#14213d;--muted:#5b6678;--line:#cfd6df;--accent:#ffc20e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--accent)}
header img{height:52px;max-width:140px;object-fit:contain;background:#fff;border-radius:6px;padding:4px}
header h1{margin:0;font:700 clamp(24px,5vw,36px)/1.1 "Barlow Condensed",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px}
.clock{text-align:center;margin:8px 0 18px}
#time{font:700 clamp(48px,12vw,84px)/1 "Barlow Condensed",sans-serif;letter-spacing:.02em}
#date{color:var(--muted);font-size:18px}
.scan{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:18px}
.scan label{display:block;font-weight:600;margin-bottom:6px}
#kode{width:100%;padding:16px;border:1px solid var(--line);border-radius:6px;font:600 24px Barlow,sans-serif;letter-spacing:.05em}
#kode:focus{outline:3px solid #2b6cff}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
#res{margin-top:16px;border-radius:8px;padding:22px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;background:#fff;border:1px solid var(--line);color:var(--muted)}
#res b{display:block;font:700 clamp(30px,7vw,46px)/1.1 "Barlow Condensed",sans-serif}
#res.ok{background:#e3f4ec;border-color:#1e8e5a;color:#145c3a}
#res.warn{background:#fff4d6;border-color:#d99a00;color:#6b4a00}
#res.err{background:#f8e6e7;border-color:#c8373b;color:#8f2226}
h2{font:700 20px "Barlow Condensed",sans-serif;margin:22px 0 8px}
#recent{list-style:none;margin:0;padding:0}
#recent li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
#recent .t{color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<header>
  <!-- Upload file logo ke GitHub dengan nama logo.png (satu folder dengan file ini) -->
  <img src="logo.png" alt="Logo perusahaan" onerror="this.remove()">
  <h1>Absensi Karyawan</h1>
</header>
<main>
  <div class="clock"><div id="time">--:--:--</div><div id="date"></div></div>

  <div class="scan">
    <label for="kode">Scan barcode di sini</label>
    <input id="kode" autocomplete="off" autofocus inputmode="text" aria-describedby="hint">
    <p class="hint" id="hint">Scan pertama = masuk, scan kedua = pulang. Untuk tes tanpa scanner, ketik nomor karyawan lalu tekan Enter.</p>
  </div>

  <div id="res" role="status" aria-live="polite">Siap menerima scan.</div>

  <h2>Scan terakhir</h2>
  <ul id="recent"></ul>
</main>

<script>
// Ganti dengan URL Web App dari Google Apps Script (lihat panduan)
const API_URL = "https://script.google.com/macros/s/AKfycbxH3vNHNHU8imFnNhhSo3gYophxZHVOODCo3FJxhZsMDlYr2PkvTsrYkdcQpJWlt5E/exec";

const $ = id => document.getElementById(id);
const input = $("kode");
let queue = [], busy = false, clearT;

function tick() {
  const n = new Date();
  $("time").textContent = n.toLocaleTimeString("id-ID", { hour12: false }).replace(/\./g, ":");
  $("date").textContent = n.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
setInterval(tick, 1000); tick();

// kursor selalu kembali ke kolom scan supaya scanner langsung bisa dipakai
const focusIn = () => input.focus();
document.addEventListener("click", focusIn);
input.addEventListener("blur", () => setTimeout(focusIn, 100));
input.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const v = input.value.trim(); input.value = "";
  if (v) { queue.push(v); pump(); }
});

function show(cls, title, sub) {
  const r = $("res"); r.className = cls; r.innerHTML = "";
  const b = document.createElement("b"); b.textContent = title;
  const s = document.createElement("span"); s.textContent = sub;
  r.append(b, s);
  clearTimeout(clearT);
  clearT = setTimeout(() => { if (!queue.length) { r.className = ""; r.textContent = "Siap menerima scan."; } }, 6000);
}
function recent(text, time) {
  const li = document.createElement("li");
  const a = document.createElement("span"); a.textContent = text;
  const t = document.createElement("span"); t.className = "t"; t.textContent = time;
  li.append(a, t); $("recent").prepend(li);
  while ($("recent").children.length > 6) $("recent").lastChild.remove();
}

async function pump() {
  if (busy) return; busy = true;
  while (queue.length) await send(queue.shift());
  busy = false;
}

async function send(kode) {
  if (API_URL.includes("PASTE_URL")) return show("err", "URL belum diisi", "URL Web App belum dipasang di file ini.");
  show("", "Memproses…", kode);
  try {
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ kode }) });
    const res = await r.json();
    if (!res.ok) return show("err", "Gagal", res.error || "Coba scan lagi.");
    const jam = n => Number(n).toLocaleString("id-ID", { maximumFractionDigits: 2 }) + " jam";
    if (res.status === "masuk") { show("ok", res.nama, "MASUK tercatat · " + res.hari + ", " + res.tanggal + " · pukul " + res.jam); recent(res.nama + " (masuk)", res.jam); }
    else if (res.status === "pulang") { show("ok", res.nama, "PULANG tercatat · masuk " + res.jam_in + ", pulang " + res.jam_out + " · total " + jam(res.total)); recent(res.nama + " (pulang)", res.jam_out); }
    else if (res.status === "terlalu_cepat") show("warn", res.nama, "Sudah scan masuk pukul " + res.jam_in + ". Scan pulang bisa dilakukan sekitar " + res.tunggu + " menit lagi.");
    else if (res.status === "selesai") show("warn", res.nama, "Hari ini sudah selesai: masuk " + res.jam_in + ", pulang " + res.jam_out + " (" + jam(res.total) + ")");
    else show("err", "Tidak terdaftar", "Nomor " + res.kode + " belum ada di data karyawan.");
  } catch (e) {
    show("err", "Tidak terhubung", "Periksa internet dan pengaturan akses Web App (Anyone), lalu scan lagi.");
  }
}
input.focus();
</script>
</body>
</html>
